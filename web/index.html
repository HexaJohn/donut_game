<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Donut: a trick-taking card game. Get to zero. Avoid the donut.">
  <meta name="theme-color" content="#0f1420">

  <!-- Added to a home screen, it opens like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Donut">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Donut</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0f1420; overflow: hidden; }
    /* Shown until the game draws over it */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #e9b949; font: 600 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading .donut {
      width: 64px; height: 64px; border-radius: 50%; border: 14px solid #e9b949; border-top-color: #e0457b;
      animation: spin 1s linear infinite;
    }
    #loading small { color: #8b95ab; font-weight: 400; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading .donut { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <div class="donut" role="img" aria-label=""></div>
    <div>Loading Donut…</div>
    <small>The first visit takes a few seconds</small>
  </div>
  <noscript><p style="color:#eee;font-family:sans-serif;text-align:center">Donut needs JavaScript to run.</p></noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
